[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "finhub-storage"
version = "0.1.0"
description = "DataFrame storage using local files, DuckDB, or PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["pandas>=2.1,<3", "numpy>=1.26,<3", "pyarrow>=14"]

[project.optional-dependencies]
duckdb = ["duckdb>=1.1,<2"]
postgres = ["psycopg2-binary>=2.9,<3"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
